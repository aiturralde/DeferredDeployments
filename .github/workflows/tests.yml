name: Tests

on:
  push:
    branches: [main]
    paths: ['.github/scripts/**']
  pull_request:
    paths: ['.github/scripts/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test .github/scripts/deployment-issue.test.js
