name: PR deployment request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: deployment-request-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ensure-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const lib = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-issue.js`);
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prLabel = `pr-${pr.number}`;
            const COMMENT_MARKER = '<!-- deployment-request:pr-comment -->';

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: `deployment-request,${prLabel}`, per_page: 100,
            });
            let issue = open.sort((a, b) => a.number - b.number)[0];

            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo,
                title: `Deployment request for PR #${pr.number}: ${pr.title}`,
                body: `Tracking ${pr.html_url}\n\n${lib.renderBody({ pr: String(pr.number) })}`,
                labels: ['deployment-request', 'pending-details', prLabel],
              });
              issue = created.data;
              // Assignment is a separate call so a missing-permission failure cannot lose the issue.
              try {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: issue.number, assignees: [pr.user.login],
                });
              } catch (error) {
                core.warning(`Could not assign @${pr.user.login}: ${error.message}`);
              }
            }

            if (pr.merged) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const existing = comments.find(c => c.body.includes(lib.MERGE_SHA_MARKER));
              const body = [
                lib.MERGE_SHA_MARKER,
                `PR #${pr.number} was merged. The scheduled deployment will check out this exact commit:`,
                '',
                `\`${pr.merge_commit_sha}\``,
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['merged'],
              });
              return;
            }

            const check = lib.validateRequest(issue.body);
            const prefill = new URLSearchParams({
              template: 'deployment-request.yml',
              title: `Deployment request for PR #${pr.number}`,
              pr: String(pr.number),
            });
            const formUrl = `${pr.base.repo.html_url}/issues/new?${prefill}`;

            const lines = [
              COMMENT_MARKER,
              '### Deployment request required',
              '',
              `This PR targets \`main\`, so it needs a scheduled deployment date before it can merge.`,
              '',
              `**[➜ Open deployment request #${issue.number} and fill in the details](${issue.html_url})**`,
              '',
              check.valid
                ? `Scheduled for **${check.date.date}** (${check.date.weekday}). ${check.date.isWeekend
                    ? 'Weekend deployment — it will wait for approval from the repository owner.'
                    : 'Weekday deployment — it will run without an approval gate.'}`
                : ['Still missing:', '', ...check.errors.map(e => `- ${e}`)].join('\n'),
              '',
              `<sub>Prefer starting over? <a href="${formUrl}">Use the deployment request form</a>.</sub>`,
            ];
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const sticky = comments.find(c => c.body.includes(COMMENT_MARKER));
            if (sticky) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: sticky.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            await github.rest.repos.createCommitStatus({
              owner, repo,
              sha: pr.head.sha,
              context: 'deployment-request/validated',
              state: check.valid ? 'success' : 'failure',
              target_url: issue.html_url,
              description: check.valid
                ? `Scheduled for ${check.date.date} (${check.date.isWeekend ? 'weekend' : 'weekday'})`
                : check.errors[0].replace(/[`*]/g, '').slice(0, 140),
            });
