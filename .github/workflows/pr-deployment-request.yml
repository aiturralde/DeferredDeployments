name: PR deployment request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: deployment-request-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ensure-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const lib = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-issue.js`);
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prLabel = `pr-${pr.number}`;
            const COMMENT_MARKER = '<!-- deployment-request:pr-comment -->';

            // Closed issues count too: the author may close the request before the PR merges.
            const candidates = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: `deployment-request,${prLabel}`, per_page: 100,
            });
            const issue = candidates
              .filter(i => !i.pull_request)
              .sort((a, b) => a.number - b.number)[0];

            if (pr.merged) {
              if (!issue) {
                core.warning(`PR #${pr.number} was merged with no deployment request, so nothing will be deployed.`);
                return;
              }
              const issueComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const existing = issueComments.find(c => c.body.includes(lib.MERGE_SHA_MARKER));
              const record = [
                lib.MERGE_SHA_MARKER,
                `PR #${pr.number} was merged. The scheduled deployment will check out this exact commit:`,
                '',
                `\`${pr.merge_commit_sha}\``,
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: record });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: record });
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['merged'],
              });
              // The poller only sees open issues, so a request closed early would never deploy.
              const labels = issue.labels.map(l => l.name || l);
              if (issue.state === 'closed' && !labels.includes('deployed')) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open' });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: 'Reopened because the deployment has not run yet. It will close automatically once deployed.',
                });
              }
              return;
            }

            const prefill = new URLSearchParams({
              template: 'deployment-request.yml',
              title: `Deployment request for PR #${pr.number}: ${pr.title}`,
              pr: String(pr.number),
            });
            const formUrl = `${pr.base.repo.html_url}/issues/new?${prefill}`;

            let state, description, targetUrl, lines;

            if (!issue) {
              state = 'failure';
              description = 'No deployment request yet - open the form';
              targetUrl = formUrl;
              lines = [
                '### Deployment request required',
                '',
                'This PR targets `main`, so the deployment has to be scheduled before it can merge.',
                '',
                `## ➜ [Open the deployment request form](${formUrl})`,
                '',
                'The pull request number is already filled in. You will be asked for the deployment',
                'date (`YYYY-MM-DD`), what you are deploying, and a rollback plan.',
                '',
                'A **weekend** date needs approval from the repository owner. A **weekday** date',
                'deploys unattended.',
              ];
            } else {
              const check = lib.validateRequest(issue.body);
              state = check.valid ? 'success' : 'failure';
              targetUrl = issue.html_url;
              description = check.valid
                ? `Scheduled for ${check.date.date} (${check.date.isWeekend ? 'weekend' : 'weekday'})`
                : check.errors[0].replace(/[`*]/g, '').slice(0, 140);
              lines = check.valid
                ? [
                    '### Deployment scheduled',
                    '',
                    `Tracked in #${issue.number} — **${check.date.date}** (${check.date.weekday}).`,
                    '',
                    check.date.isWeekend
                      ? 'Weekend deployment: it will wait for approval from the repository owner.'
                      : 'Weekday deployment: it will run without an approval gate.',
                  ]
                : [
                    '### Deployment request incomplete',
                    '',
                    `Tracked in #${issue.number}. Edit that issue to fill in the missing parts:`,
                    '',
                    ...check.errors.map(e => `- ${e}`),
                    '',
                    `<sub>Prefer to start over? <a href="${formUrl}">Open a fresh form</a>.</sub>`,
                  ];
            }

            const body = [COMMENT_MARKER, ...lines].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const sticky = comments.find(c => c.body.includes(COMMENT_MARKER));
            if (sticky) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: sticky.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            // target_url points at the form when nothing exists yet, so "Details" on the red
            // check takes the author straight there.
            await github.rest.repos.createCommitStatus({
              owner, repo,
              sha: pr.head.sha,
              context: 'deployment-request/validated',
              state,
              target_url: targetUrl,
              description,
            });
