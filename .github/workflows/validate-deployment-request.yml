name: Validate deployment request

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: deployment-request-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'deployment-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const lib = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-issue.js`);
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const MARKER = '<!-- deployment-request:validation -->';

            const setLabel = async (name, present) => {
              const has = (issue.labels || []).some(l => (l.name || l) === name);
              if (present && !has) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [name] });
              } else if (!present && has) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            };

            const upsertComment = async (body) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const existing = comments.find(c => c.body.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: `${MARKER}\n${body}` });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `${MARKER}\n${body}` });
              }
            };

            const check = lib.validateRequest(issue.body);

            if (check.pr) {
              const prLabel = `pr-${check.pr}`;
              await setLabel(prLabel, true);

              // The PR workflow already opened a canonical issue, so a hand-filed form can duplicate it.
              const siblings = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: `deployment-request,${prLabel}`, per_page: 100,
              });
              const canonical = siblings.sort((a, b) => a.number - b.number)[0];
              if (canonical && canonical.number !== issue.number) {
                await upsertComment(
                  `Closing as a duplicate of #${canonical.number}, which is the canonical deployment request for PR #${check.pr}.`
                );
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned' });
                return;
              }
            }

            await setLabel('pending-details', !check.valid);
            await setLabel('deploy-weekend', check.valid && check.date.isWeekend);
            await setLabel('deploy-weekday', check.valid && !check.date.isWeekend);

            if (!check.valid) {
              await upsertComment(
                ['This deployment request is **not ready** yet:', '', ...check.errors.map(e => `- ${e}`),
                 '', 'Edit the issue description to fix these — validation re-runs automatically.'].join('\n')
              );
            } else {
              await upsertComment(
                [`Scheduled for **${check.date.date}** (${check.date.weekday}, ${lib.TZ}).`, '',
                 check.date.isWeekend
                   ? `This is a **weekend** deployment, so it will pause for approval on the \`${check.date.environment}\` environment.`
                   : `This is a **weekday** deployment, so it will run on \`${check.date.environment}\` without an approval gate.`,
                 '', 'It runs once the pull request is merged and the date arrives.'].join('\n')
              );
            }

            if (!check.pr) {
              core.warning('No usable pull request number, so no commit status was published.');
              return;
            }

            let pull;
            try {
              pull = (await github.rest.pulls.get({ owner, repo, pull_number: check.pr })).data;
            } catch (error) {
              core.warning(`Could not load PR #${check.pr}: ${error.message}`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner, repo,
              sha: pull.head.sha,
              context: 'deployment-request/validated',
              state: check.valid ? 'success' : 'failure',
              target_url: issue.html_url,
              description: check.valid
                ? `Scheduled for ${check.date.date} (${check.date.isWeekend ? 'weekend' : 'weekday'})`
                : check.errors[0].replace(/[`*]/g, '').slice(0, 140),
            });
